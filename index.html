<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Watermark Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--ink:#1B2A4A;--ink-soft:#4A5578;--paper:#F6F4EF;--paper-line:#E3DFD3;--gold:#B08D57;--good:#2F6B4F;--bad:#A63A3A;--radius:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);background-image:repeating-linear-gradient(var(--paper-line) 0 1px,transparent 1px 32px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh;padding:0 0 60px}
.app{width:100%;max-width:460px;margin:auto;padding:28px 20px 0}
header{text-align:center;margin-bottom:22px}
header .mark{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:34px;color:var(--ink);transform:rotate(-6deg);display:inline-block;margin-bottom:2px}
header p{margin:4px 0;color:var(--ink-soft);font-size:14px}
.card{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(27,42,74,.06)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin:0 0 14px;font-weight:700}
label.field{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 6px}
label.field:first-of-type{margin-top:0}
input[type=text],input[type=tel]{width:100%;padding:13px 14px;border:1.5px solid var(--paper-line);border-radius:10px;font-size:16px;color:var(--ink);background:var(--paper)}
input:focus{outline:none;border-color:var(--gold)}
.settings-summary{display:flex;justify-content:space-between;align-items:center}
.settings-summary div{font-size:14px;line-height:1.5}
.settings-summary b{display:block}
.link-btn{background:none;border:0;color:var(--gold);font-size:14px;font-weight:600;cursor:pointer;padding:6px}
.upload-zone{display:block;position:relative;width:100%;border:0;font:inherit;color:inherit;border:2px dashed var(--paper-line);border-radius:var(--radius);padding:36px 20px;text-align:center;background:#fff;cursor:pointer;transition:border-color .15s}
.upload-zone.disabled{opacity:.5}
.upload-zone:active{border-color:var(--gold)}
.upload-zone .icon{font-size:30px;margin-bottom:8px}
.upload-zone .big{font-size:17px;font-weight:700;color:var(--ink)}
.upload-zone .small{font-size:13px;color:var(--ink-soft);margin-top:4px}
#fileInput{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:10}
.btn{display:block;width:100%;padding:15px;border-radius:12px;border:0;font-size:16px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
.btn-primary{background:var(--ink);color:#fff}
.btn-secondary{background:transparent;color:var(--ink-soft);margin-top:10px;font-weight:600;font-size:14px;padding:8px}
.status{text-align:center;padding:10px 0;font-size:14px;color:var(--ink-soft)}
.status.error{color:var(--bad)}
.spinner{width:22px;height:22px;border:3px solid var(--paper-line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 10px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.result{text-align:center}
.result .check{font-size:36px;color:var(--good);margin-bottom:6px}
.result .fname{font-size:13px;color:var(--ink-soft);margin-bottom:16px;word-break:break-all}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<header>
<div class="mark">Watermark</div>
<p>Add your stamp to any PDF, right from your phone</p>
</header>

<div class="card" id="setupCard">
<h2>Your details</h2>
<label class="field" for="wmText">Watermark text (the big slanted text)</label>
<input type="text" id="wmText" placeholder="">
<label class="field" for="footerName">Full name (shown bottom-right)</label>
<input type="text" id="footerName" placeholder="">
<label class="field" for="footerPhone">Phone number (shown bottom-right)</label>
<input type="tel" id="footerPhone" placeholder="">
<button class="btn btn-primary" style="margin-top:18px" id="saveSettingsBtn">Save my details</button>
</div>

<div class="card hidden" id="summaryCard">
<div class="settings-summary">
<div><b id="summaryName"></b><span id="summaryPhone"></span></div>
<button class="link-btn" id="editSettingsBtn">Edit</button>
</div>
</div>

<div class="upload-zone disabled" id="uploadZone" role="button" tabindex="0" aria-label="Choose a PDF">
<div class="icon">📄</div>
<div class="big">Tap to choose a PDF</div>
<div class="small">Choose a PDF and it will be stamped automatically.</div>
<input type="file" id="fileInput" accept="application/pdf,.pdf">
</div>

<div class="card hidden" id="workingCard">
<div class="spinner"></div>
<div class="status" id="workingStatus">Stamping your PDF…</div>
</div>

<div class="card hidden" id="resultCard">
<div class="result">
<div class="check">✓</div>
<div class="status">Done — your PDF is ready</div>
<div class="fname" id="resultFilename"></div>
<a href="#" class="btn btn-primary" id="downloadBtn">Download / Share PDF</a>
<button class="btn btn-secondary" id="anotherBtn">Stamp another PDF</button>
</div>
</div>

<div class="status error hidden" id="errorStatus"></div>
<noscript><div class="status error">JavaScript must be enabled for the watermark tool to work.</div></noscript>
</div>

<script>
const PDFLibReady = typeof PDFLib !== "undefined";
const {PDFDocument,rgb,degrees,StandardFonts} = PDFLibReady ? PDFLib : {};
const setupCard=document.getElementById("setupCard");
const summaryCard=document.getElementById("summaryCard");
const uploadZone=document.getElementById("uploadZone");
const fileInput=document.getElementById("fileInput");
const workingCard=document.getElementById("workingCard");
const workingStatus=document.getElementById("workingStatus");
const resultCard=document.getElementById("resultCard");
const errorStatus=document.getElementById("errorStatus");
const downloadBtn=document.getElementById("downloadBtn");

let settings=null;
let currentObjectUrl=null;

function showOnly(el){
  [setupCard,summaryCard].forEach(c=>c.classList.add("hidden"));
  el.classList.remove("hidden");
}

function renderSummary(){
  document.getElementById("summaryName").textContent=settings.footerName;
  document.getElementById("summaryPhone").textContent=settings.footerPhone;
  showOnly(summaryCard);
  uploadZone.classList.remove("disabled");
  fileInput.disabled=false;
}

function saveSettings(){
  const wmText=document.getElementById("wmText").value.trim();
  const footerName=document.getElementById("footerName").value.trim();
  const footerPhone=document.getElementById("footerPhone").value.trim();

  if(!wmText||!footerName||!footerPhone){
    errorStatus.textContent="Please fill in all three fields.";
    errorStatus.classList.remove("hidden");
    return;
  }

  settings={wmText,footerName,footerPhone};

  try{
    localStorage.setItem("watermark-settings",JSON.stringify(settings));
  }catch(e){}

  errorStatus.classList.add("hidden");
  renderSummary();
}

fileInput.disabled=true;

function loadSettings(){
  try{
    const saved=localStorage.getItem("watermark-settings");
    if(saved){
      settings=JSON.parse(saved);
      document.getElementById("wmText").value=settings.wmText||"";
      document.getElementById("footerName").value=settings.footerName||"";
      document.getElementById("footerPhone").value=settings.footerPhone||"";
      renderSummary();
      return;
    }
  }catch(e){}
  showOnly(setupCard);
}

document.getElementById("saveSettingsBtn").addEventListener("click",saveSettings);

document.getElementById("editSettingsBtn").addEventListener("click",()=>{
  showOnly(setupCard);
  uploadZone.classList.add("disabled");
  fileInput.disabled=true;
});

function handleFile(file){
  if(!file)return;
  if(!PDFLibReady){
    errorStatus.textContent="The PDF engine did not load. Please refresh the page and try again.";
    errorStatus.classList.remove("hidden");
    return;
  }

  if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf")){
    errorStatus.textContent="That doesn't look like a PDF — please choose a PDF file.";
    errorStatus.classList.remove("hidden");
    return;
  }

  if(!settings){
    errorStatus.textContent="Please save your details first.";
    errorStatus.classList.remove("hidden");
    return;
  }

  errorStatus.classList.add("hidden");
  resultCard.classList.add("hidden");
  workingCard.classList.remove("hidden");
  workingStatus.textContent="Stamping your PDF…";

  setTimeout(async()=>{
    try{
      const bytes=await file.arrayBuffer();
      const stampedBytes=await stampPdf(bytes,settings);
      const blob=new Blob([stampedBytes],{type:"application/pdf"});

      if(currentObjectUrl)URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl=URL.createObjectURL(blob);

      const outName=file.name.replace(/\.pdf$/i,"")+" - stamped.pdf";
      downloadBtn.href=currentObjectUrl;
      downloadBtn.download=outName;
      document.getElementById("resultFilename").textContent=outName;

      workingCard.classList.add("hidden");
      resultCard.classList.remove("hidden");
    }catch(err){
      console.error(err);
      workingCard.classList.add("hidden");
      errorStatus.textContent="Couldn't stamp that PDF. Please try another PDF.";
      errorStatus.classList.remove("hidden");
    }
  },50);
}



fileInput.addEventListener("change",e=>{
  const file=e.target.files&&e.target.files[0];
  handleFile(file);
  e.target.value="";
});

["dragenter","dragover"].forEach(evt=>{
  uploadZone.addEventListener(evt,e=>{
    e.preventDefault();
    uploadZone.style.borderColor="var(--gold)";
  });
});

["dragleave","dragend"].forEach(evt=>{
  uploadZone.addEventListener(evt,e=>{
    e.preventDefault();
    uploadZone.style.borderColor="";
  });
});

uploadZone.addEventListener("drop",e=>{
  e.preventDefault();
  uploadZone.style.borderColor="";
  const file=e.dataTransfer.files&&e.dataTransfer.files[0];
  handleFile(file);
});

document.getElementById("anotherBtn").addEventListener("click",()=>{
  resultCard.classList.add("hidden");
  fileInput.value="";
});

/* On iPhone, use the native share sheet when available.
   Otherwise the normal download link is used. */
downloadBtn.addEventListener("click",async e=>{
  if(!currentObjectUrl)return;

  try{
    if(navigator.share && navigator.canShare){
      e.preventDefault();
      const response=await fetch(currentObjectUrl);
      const blob=await response.blob();
      const file=new File([blob],downloadBtn.download,{type:"application/pdf"});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:downloadBtn.download});
      }
    }
  }catch(err){
    if(err&&err.name==="AbortError")return;
  }
});

async function stampPdf(arrayBuffer,s){
  const pdfDoc=await PDFDocument.load(arrayBuffer);
  const italicFont=await pdfDoc.embedFont(StandardFonts.HelveticaOblique);
  const boldFont=await pdfDoc.embedFont(StandardFonts.HelveticaBold);
  const regFont=await pdfDoc.embedFont(StandardFonts.Helvetica);
  const pages=pdfDoc.getPages();
  const angle=35;
  const angleRad=angle*Math.PI/180;

  for(const page of pages){
    const {width,height}=page.getSize();

    const wmFontSize=Math.min(width,height)*0.16;
    const wmWidth=italicFont.widthOfTextAtSize(s.wmText,wmFontSize);
    const cx=width/2,cy=height/2;
    const wmX=cx-(wmWidth/2)*Math.cos(angleRad);
    const wmY=cy-(wmWidth/2)*Math.sin(angleRad);

    page.drawText(s.wmText,{
      x:wmX,y:wmY,size:wmFontSize,font:italicFont,
      color:rgb(.55,.55,.55),opacity:.32,rotate:degrees(angle)
    });

    const margin=Math.min(width,height)*.045;
    const nameFontSize=Math.min(width,height)*.028;
    const phoneFontSize=nameFontSize*.82;
    const nameWidth=boldFont.widthOfTextAtSize(s.footerName,nameFontSize);
    const phoneWidth=regFont.widthOfTextAtSize(s.footerPhone,phoneFontSize);
    const phoneY=margin;
    const nameY=margin+phoneFontSize+nameFontSize*.35;

    page.drawText(s.footerName,{
      x:width-margin-nameWidth,y:nameY,size:nameFontSize,
      font:boldFont,color:rgb(.1,.1,.1)
    });

    page.drawText(s.footerPhone,{
      x:width-margin-phoneWidth,y:phoneY,size:phoneFontSize,
      font:regFont,color:rgb(.1,.1,.1)
    });
  }

  return pdfDoc.save();
}

loadSettings();
</script>
</body>
</html>
